name = "turing"
main = "worker.js"
compatibility_date = "2025-07-01"

workers_dev = false
routes = [{ pattern = "turing.heyitsmejosh.com", custom_domain = true }]

[assets]
directory = "web"
binding = "ASSETS"

# the 1B that reads articles for the landing demo. On the Mac this is Ollama.
[ai]
binding = "AI"

# 20 questions a minute per visitor keeps the demo a demo
[[ratelimits]]
name = "LIMIT"
namespace_id = "2109"

  [ratelimits.simple]
  limit = 20
  period = 60

# a picture costs far more than an answer, so 5 a minute per visitor
[[ratelimits]]
name = "DRAW_LIMIT"
namespace_id = "2110"

  [ratelimits.simple]
  limit = 5
  period = 60

[observability]
enabled = true
