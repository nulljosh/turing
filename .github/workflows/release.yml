name: release

# Releases cut themselves. When a push to main carries a VERSION with no tag yet and the test
# workflow passes on that exact commit, this tags it and publishes the GitHub release. Nobody runs
# release.sh by hand for a cloud-built release. The Mac-only gate (./gate.sh --full: her real
# model, Pixelmator, the live page) and the site deploy still run whenever release.sh runs on the Mac.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag and publish the version in VERSION, once
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION is not X.Y.Z: $V"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V already released"; exit 0; fi
          # the note is the release commit's subject after "Release vX.Y.Z: ", else the head commit's subject
          NOTE=$(git log --format=%s -n 50 "$SHA" | sed -n "s/^Release v$V: //p" | head -1)
          [ -n "$NOTE" ] || NOTE=$(git log --format=%s -n 1 "$SHA")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "$NOTE" "$SHA"
          git push origin "v$V"
          gh release create "v$V" --title "v$V" --notes "$NOTE" --generate-notes --verify-tag
