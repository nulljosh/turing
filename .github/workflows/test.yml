name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 test_chat.py
      # her hands: the Pixelmator driver's own unit tests, no app needed
      - run: cd pixelmator && python3 -m unittest
      # her image tools: unit tests for the image processing tools, mocked
      - run: python3 test_tools_image.py
      # the regex router, and the landing page's JavaScript port of it, must agree on every case
      - run: python3 eval/actions.py
      - run: python3 eval/web_parity.py
      # her utility tools: the Python side, and the JavaScript twin on the landing page, must say the same words
      - run: python3 tools_util.py
      - run: python3 eval/util_diff.py
      # her hands over MCP: a real client conversation against the stdio server
      - run: python3 test_mcp.py
      - run: python3 test_harness.py
      - run: python3 test_tabs.py
      - run: python3 test_memory.py
      # the laws in LAWS.md, checked against every tool
      - run: python3 eval/laws.py

  # eval/score.py is deliberately not run here: it needs the actual Qwen
  # model (MLX, Apple Silicon only) and a live brain API token, neither
  # of which a standard runner has. Run it locally, the pre-commit hook
  # already gates every ask.py/chat.py/FAQ.md/prompts.jsonl change.

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # every function and class documented, no exceptions
      - run: python3 stats.py --check
      - name: README file references aren't stale
        run: |
          python3 - <<'PY'
          import re, os, sys
          refs = re.findall(r'(?:src="|\]\()([^")#?\s]+)', open("README.md").read())
          bad = [r for r in refs if "://" not in r and not r.startswith(("mailto:", "/")) and not os.path.exists(r)]
          print("stale README refs:", bad)
          sys.exit(bool(bad))
          PY
