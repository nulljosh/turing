name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_chat.py
      # her hands: the Pixelmator driver's own unit tests, no app needed
      - run: cd pixelmator && python3 -m unittest
      # her image tools: unit tests for the image processing tools, mocked
      - run: python3 tests/test_tools_image.py
      # her badge modernizer: step_for and modernize, skips clean on ubuntu (no potrace/swift)
      - run: python3 tests/test_badge.py
      # the regex router, and the landing page's JavaScript port of it, must agree on every case
      - run: python3 eval/actions.py
      - run: python3 eval/web_parity.py
      # her utility tools: the Python side, and the JavaScript twin on the landing page, must say the same words
      - run: python3 tools_util.py
      # the router and every tool's self-check, all subprocesses and /Applications mocked
      - run: SAMANTHA_HEADLESS=1 python3 tools.py
      - run: python3 eval/util_diff.py
      # her hands over MCP: a real client conversation against the stdio server
      - run: python3 tests/test_mcp.py
      - run: python3 tests/test_harness.py
      # edge cases: empty, huge, unicode, negative, half-finished and offline input, never a crash
      - run: python3 tests/test_edges.py
      # ask_llm against fake local servers: never a real model call in CI
      - run: python3 tests/test_llm.py
      - run: python3 tests/test_library.py
      - run: python3 tests/test_distill.py
      - run: python3 tests/test_voice.py
      - run: python3 tests/test_chat_pipe.py
      - run: python3 tests/test_gui.py
      - run: python3 tests/test_see.py
      - run: python3 tests/test_research.py
      - run: python3 tests/test_write.py
      # a sandboxed Python for CSV stats and charts: ask_llm is mocked, the sandbox itself runs for real
      - run: python3 tests/test_run_code.py
      - run: python3 tests/test_needs_me.py
      - run: python3 tests/test_organizer.py
      - run: python3 tests/test_system.py
      - run: python3 tests/test_dev.py
      - run: python3 tests/test_tabs.py
      - run: python3 tests/test_memory.py
      - run: python3 tests/test_feedback.py
      - run: python3 tests/test_followup.py
      - run: python3 tests/test_planner.py
      - run: python3 tests/test_screen.py
      - run: python3 tests/test_documents.py
      - run: python3 tests/test_reader.py
      # law 9: what she reads can never pick or trigger a tool
      - run: python3 tests/test_untrusted.py
      # the laws in LAWS.md, checked against every tool
      - run: python3 eval/laws.py
      # GGUF backend (Windows/Linux path, llama-cpp-python, CPU): pip only, no MLX, no internet
      # beyond the wheel. Skips cleanly and prints why when models/samantha-hands.gguf isn't
      # here (it's gitignored, built on a Mac by training/export_gguf.py); the real 20-case
      # comparison against MLX's own picks runs on the Mac in ./gate.sh --full.
      - run: pip install -q llama-cpp-python
      - run: python3 tests/test_gguf_parity.py

  # eval/score.py is deliberately not run here: it needs the actual Qwen
  # model (MLX, Apple Silicon only) and a live brain API token, neither
  # of which a standard runner has. Run it locally, the pre-commit hook
  # already gates every ask.py/chat.py/FAQ.md/prompts.jsonl change.

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # every function and class documented, no exceptions
      - run: python3 stats.py --check
      - name: README file references aren't stale
        run: |
          python3 - <<'PY'
          import re, os, sys
          refs = re.findall(r'(?:src="|\]\()([^")#?\s]+)', open("README.md").read())
          bad = [r for r in refs if "://" not in r and not r.startswith(("mailto:", "/")) and not os.path.exists(r)]
          print("stale README refs:", bad)
          sys.exit(bool(bad))
          PY
