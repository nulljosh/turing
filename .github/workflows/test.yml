name: test

on:
  push:
  pull_request:

jobs:
  test_chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 test_chat.py

  # eval/score.py is deliberately not run here: it needs the actual Qwen
  # model (MLX, Apple Silicon only) and a live brain API token, neither
  # of which a standard runner has. Run it locally, the pre-commit hook
  # already gates every ask.py/chat.py/FAQ.md/prompts.jsonl change.
