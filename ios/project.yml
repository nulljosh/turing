name: Samantha
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Samantha:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.samantha
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
  SamanthaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Samantha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.samantha.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
        TEST_TARGET_NAME: Samantha
schemes:
  Samantha:
    build:
      targets:
        Samantha: all
        SamanthaUITests: [test]
    test:
      targets:
        - SamanthaUITests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
