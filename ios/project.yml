name: Samantha
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Samantha:
    type: application
    # one target, two destinations: the same SwiftUI app on iPhone and Mac (Mac Catalyst is not used; it is a real Mac app)
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # her router and the 49 exact tools, the same file the landing page and the Mac parity check run
      - path: ../web/samantha.js
        buildPhase: resources
      # her flower as a Liquid Glass icon, the same Icon Composer bundle the Mac app compiles (icon composer skill, always)
      - path: ../gui/Samantha.icon
        buildPhase: resources
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.samantha
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Samantha
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Samantha.entitlements   # the Mac App Store sandbox; iOS needs none
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
  SamanthaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Samantha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.samantha.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
        TEST_TARGET_NAME: Samantha
schemes:
  Samantha:
    build:
      targets:
        Samantha: all
        SamanthaUITests: [test]
    test:
      targets:
        - SamanthaUITests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
